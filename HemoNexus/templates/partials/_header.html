<!-- HemoNexus Top Navigation Bar -->
<header class="app-header">
  <div class="header-left d-flex align-center gap-3">
    <button class="sidebar-toggle-btn btn btn-icon btn-sm btn-outline d-md-none" id="sidebarToggleBtn" aria-label="Toggle Navigation">
      <i class="fa-solid fa-bars"></i>
    </button>
    
    <div class="header-search position-relative">
      <div class="input-group">
        <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-magnifying-glass"></i></span>
        <input type="text" class="form-control border-start-0 ps-0" placeholder="Search donors, requests, blood groups... (Ctrl+K)" id="globalSearchInput" onkeydown="if(event.key === 'Enter') { window.location.href = '/donors?q=' + encodeURIComponent(this.value); }">
      </div>
    </div>
  </div>

  <div class="header-right d-flex align-center gap-3">
    <!-- Quick Public Portal Jump -->
    <a href="/home" class="btn btn-outline btn-sm d-none d-lg-inline-flex" title="Go to Public Portal">
      <i class="fa-solid fa-house-medical me-1"></i> Public Portal
    </a>


    <!-- Quick Emergency SOS Button -->
    <a href="/emergency" class="btn btn-emergency btn-sm animate-pulse-sos" title="Code-Red Emergency SOS">
      <i class="fa-solid fa-truck-medical me-1"></i>
      <span>Emergency SOS</span>
    </a>

    <!-- Notifications Bell -->
    <div class="notif-bell-wrapper position-relative" id="notifBellWrapper">
      <button class="notification-bell-btn btn btn-icon btn-outline position-relative"
              id="notifBellBtn"
              title="Live Alerts"
              aria-haspopup="true"
              aria-expanded="false"
              onclick="HemoNotif.togglePanel(event)">
        <i class="fa-regular fa-bell" id="notifBellIcon"></i>
        <span class="bell-badge position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none"
              id="notifBadge"
              aria-label="unread notifications"></span>
      </button>

      <!-- Notification Dropdown Panel -->
      <div class="notif-panel card shadow-lg border-0 d-none"
           id="notifPanel"
           role="dialog"
           aria-label="Notifications">
        <div class="notif-panel-header d-flex align-items-center justify-content-between px-3 py-2 border-bottom">
          <span class="fw-bold text-sm text-ink">
            <i class="fa-solid fa-bell me-2 text-crimson"></i>Live Alerts
          </span>
          <button class="btn btn-sm btn-link text-muted p-0 text-decoration-none"
                  id="notifMarkAllBtn"
                  onclick="event.stopPropagation(); HemoNotif.markAllRead(event);"
                  title="Mark all as read" style="font-size:0.72rem; cursor: pointer;">
            Mark all read
          </button>

        </div>
        <div class="notif-list" id="notifList">
          <div class="notif-empty text-center text-muted py-4 px-3" id="notifEmpty">
            <i class="fa-regular fa-bell-slash fa-2x mb-2 d-block text-muted"></i>
            <span style="font-size:0.8rem;">No new alerts</span>
          </div>
        </div>
        <div class="notif-panel-footer border-top text-center py-2">
          <a href="/emergency" class="text-crimson text-decoration-none" style="font-size:0.75rem;">
            <i class="fa-solid fa-truck-medical me-1"></i>Emergency SOS
          </a>
        </div>
      </div>
    </div>

    <!-- User Profile Dropdown / Sign In -->
    {% if session.get('user_name') %}
    <div class="header-user d-flex align-center gap-2 p-1 rounded-lg border bg-white cursor-pointer" onclick="HemoUI.showToast('Signed In Account', 'Active: {{ session.get('user_name') }} ({{ session.get('role', 'user').capitalize() }})', 'info')">
      <div class="user-avatar" style="width: 2rem; height: 2rem; font-size: 0.75rem; background: var(--crimson); color: white; display: flex; align-items: center; justify-content: center; border-radius: 50%;">
        {{ session.get('user_name')[:2].upper() }}
      </div>
      <div class="user-info d-none d-sm-block text-start">
        <div class="user-name fw-bold text-xs text-ink lh-1" id="headerUserName">{{ session.get('user_name') }}</div>
        <div class="user-role text-muted text-capitalize" id="headerUserRole" style="font-size: 0.65rem;">{{ session.get('role', 'user') }}</div>
      </div>
    </div>
    <a href="/logout" class="btn btn-outline-danger btn-sm" title="Sign Out">
      <i class="fa-solid fa-arrow-right-from-bracket me-1"></i> Sign Out
    </a>
    {% else %}
    <a href="/login" class="btn btn-primary btn-sm">
      <i class="fa-solid fa-user-lock me-1"></i> Sign In
    </a>
    {% endif %}
  </div>
</header>
