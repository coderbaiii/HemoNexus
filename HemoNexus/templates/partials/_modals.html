<!-- 1. Add New Donor Modal -->
<div class="modal-backdrop" id="addDonorModal">
  <div class="modal-dialog modal-dialog-lg">
    <div class="modal-header">
      <div class="d-flex align-center gap-2">
        <div class="brand-icon" style="width: 2rem; height: 2rem; font-size: 0.9rem;">
          <i class="fa-solid fa-user-plus"></i>
        </div>
        <h3 class="modal-title">Register New Blood Donor</h3>
      </div>
      <button class="modal-close" data-modal-close>&times;</button>
    </div>
    <form id="addDonorForm" onsubmit="event.preventDefault(); handleAddDonorSubmit();">
      <div class="modal-body">
        <div class="d-grid grid-2 gap-4">
          <div class="form-group">
            <label class="form-label">Full Name *</label>
            <input type="text" class="form-control" id="newDonorName" placeholder="e.g. Rahul Sharma" required>
          </div>
          <div class="form-group">
            <label class="form-label">Blood Group *</label>
            <select class="form-select" id="newDonorBloodGroup" required>
              <option value="O-">O- (Universal Donor)</option>
              <option value="O+">O+</option>
              <option value="A-">A-</option>
              <option value="A+">A+</option>
              <option value="B-">B-</option>
              <option value="B+">B+</option>
              <option value="AB-">AB-</option>
              <option value="AB+">AB+ (Universal Plasma)</option>
            </select>
          </div>
        </div>

        <div class="d-grid grid-2 gap-4">
          <div class="form-group">
            <label class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="newDonorPhone" placeholder="+91 98765 43210" required>
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="newDonorEmail" placeholder="rahul@example.com">
          </div>
        </div>

        <div class="d-grid grid-2 gap-4">
          <div class="form-group">
            <label class="form-label">City & Area *</label>
            <input type="text" class="form-control" id="newDonorArea" placeholder="e.g. Bandra West, Mumbai" required>
          </div>
          <div class="form-group">
            <label class="form-label">Gender & Age *</label>
            <div class="d-flex gap-2">
              <select class="form-select" id="newDonorGender" style="flex: 1;">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
              <input type="number" class="form-control" id="newDonorAge" placeholder="Age" min="18" max="65" value="28" style="width: 80px;" required>
            </div>
          </div>
        </div>

        <div class="d-grid grid-3 gap-4 mt-2">
          <div class="form-group">
            <label class="form-label">Weight (kg)</label>
            <input type="number" class="form-control" id="newDonorWeight" value="70">
          </div>
          <div class="form-group">
            <label class="form-label">Hemoglobin (g/dL)</label>
            <input type="text" class="form-control" id="newDonorHb" value="14.5">
          </div>
          <div class="form-group">
            <label class="form-label">Last Donated Date</label>
            <input type="date" class="form-control" id="newDonorLastDate" value="2026-03-01">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-modal-close>Cancel</button>
        <button type="submit" class="btn btn-primary">
          <i class="fa-solid fa-check"></i> Register Donor
        </button>
      </div>
    </form>
  </div>
</div>

<!-- 2. Quick Contact Modal -->
<div class="modal-backdrop" id="contactModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 class="modal-title">Contact Donor</h3>
      <button class="modal-close" data-modal-close>&times;</button>
    </div>
    <div class="modal-body text-center p-6">
      <div class="blood-badge blood-badge-lg mx-auto mb-3" id="contactModalBlood">O-</div>
      <h4 class="text-xl fw-bold text-slate-900" id="contactModalName">Aarav Sharma</h4>
      <p class="text-xs text-muted mb-4" id="contactModalArea">Andheri West • 2.4 km away</p>

      <div class="d-flex flex-column gap-3">
        <a href="#" id="contactModalPhoneBtn" class="btn btn-primary btn-lg justify-center">
          <i class="fa-solid fa-phone"></i> Voice Call
        </a>
        <a href="#" id="contactModalWhatsAppBtn" class="btn btn-success btn-lg justify-center" style="background-color: #25D366; border-color: #25D366;">
          <i class="fa-brands fa-whatsapp"></i> WhatsApp Direct
        </a>
        <button class="btn btn-outline btn-lg justify-center" onclick="HemoUI.showToast('SMS Dispatch', 'Standard emergency dispatch SMS dispatched with map link.', 'info'); HemoUI.closeModal('contactModal');">
          <i class="fa-solid fa-comment-sms"></i> Send Emergency SMS
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 3. Landing Auth Modal -->
<div class="modal-backdrop" id="authModal">
  <div class="modal-dialog">
    <div class="modal-header">
      <div class="nav-tabs" style="border: none; margin: 0;">
        <div class="nav-tab-item active" data-tab-target="tabLogin">Login</div>
        <div class="nav-tab-item" data-tab-target="tabRegister">Donor Sign Up</div>
      </div>
      <button class="modal-close" data-modal-close>&times;</button>
    </div>
    <div class="modal-body">
      <!-- Login Tab -->
      <div id="tabLogin" class="tab-pane">
        <form onsubmit="event.preventDefault(); window.location.href='/dashboard';">
          <div class="form-group">
            <label class="form-label">Email or Phone</label>
            <input type="text" class="form-control" placeholder="doctor@hospital.org" value="lead.coordinator@hemonexus.org" required>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" value="••••••••••••" required>
          </div>
          <button type="submit" class="btn btn-primary w-full mt-4">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Sign In to Dashboard
          </button>
        </form>
      </div>

      <!-- Register Tab -->
      <div id="tabRegister" class="tab-pane d-none">
        <form onsubmit="event.preventDefault(); HemoUI.showToast('Registration Successful', 'Welcome to HemoNexus! Check your SMS for donor onboarding.', 'success'); HemoUI.closeModal('authModal');">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" placeholder="Your Name" required>
          </div>
          <div class="form-group">
            <label class="form-label">Blood Group</label>
            <select class="form-select" required>
              <option value="O+">O+</option>
              <option value="O-">O-</option>
              <option value="A+">A+</option>
              <option value="A-">A-</option>
              <option value="B+">B+</option>
              <option value="B-">B-</option>
              <option value="AB+">AB+</option>
              <option value="AB-">AB-</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Mobile Number</label>
            <input type="tel" class="form-control" placeholder="+91 98765 00000" required>
          </div>
          <button type="submit" class="btn btn-primary w-full mt-4">
            <i class="fa-solid fa-heart-pulse"></i> Register as Blood Donor
          </button>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
function handleAddDonorSubmit() {
  const name = document.getElementById('newDonorName').value;
  const bloodGroup = document.getElementById('newDonorBloodGroup').value;
  const phone = document.getElementById('newDonorPhone').value;
  const email = document.getElementById('newDonorEmail').value;
  const area = document.getElementById('newDonorArea').value;
  const gender = document.getElementById('newDonorGender').value;
  const age = parseInt(document.getElementById('newDonorAge').value);
  const weightKg = parseInt(document.getElementById('newDonorWeight').value);
  const hemoglobin = document.getElementById('newDonorHb').value + ' g/dL';
  const lastDonatedDate = document.getElementById('newDonorLastDate').value;

  const newDonor = HemoStore.addDonor({
    name,
    bloodGroup,
    phone,
    email,
    city: 'Mumbai',
    area,
    gender,
    age,
    weightKg,
    hemoglobin,
    lastDonatedDate,
    status: 'available'
  });

  HemoUI.showToast('Donor Registered', `${name} (${bloodGroup}) has been successfully added to the donor registry.`, 'success');
  HemoUI.closeModal('addDonorModal');
  
  if (typeof renderDonorsList === 'function') {
    renderDonorsList();
  }
}

function openContactModal(name, blood, phone, area) {
  document.getElementById('contactModalName').textContent = name;
  document.getElementById('contactModalBlood').textContent = blood;
  document.getElementById('contactModalArea').textContent = area;
  document.getElementById('contactModalPhoneBtn').href = 'tel:' + phone;
  document.getElementById('contactModalWhatsAppBtn').href = 'https://wa.me/' + phone.replace(/[^0-9]/g, '');
  HemoUI.openModal('contactModal');
}
</script>
